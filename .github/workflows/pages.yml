name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build project-site artifact
        run: |
          mkdir "$RUNNER_TEMP/site"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'videos' ./ "$RUNNER_TEMP/site/"
          node tools/pages-prefix.mjs "$RUNNER_TEMP/site" vscaleexotics

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
