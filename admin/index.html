<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>V-Scale Exotics — Content</title>
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/icon-192.png">

<!--
  This page intentionally runs under a LOOSER Content Security Policy than the
  rest of the site. Decap CMS is a third-party React application: it injects its
  own styles at runtime and talks to DecapBridge and the GitHub API.

  The relaxation is scoped to /admin/ only — every other page on this origin
  keeps `default-src 'self'` with no external origins at all. See SECURITY.md.

  The version below is pinned deliberately. Do not float it to `latest`:
  the admin panel has write access to the repository, so an unreviewed bundle
  update is a supply-chain change to your content.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://unpkg.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://avatars.githubusercontent.com;
  font-src 'self' data:;
  connect-src 'self' https://auth.decapbridge.com https://gateway.decapbridge.com https://api.github.com;
  frame-src 'self';
  object-src 'none';
  base-uri 'none';
  form-action 'self';
  upgrade-insecure-requests">
</head>
<body>
<!--
  `script-src https://unpkg.com` allows ANY script from unpkg, so the pinned
  version in the URL is a convention, not a control — unpkg serves whatever npm
  holds for that tag. This page can commit to the repository, so a tampered or
  re-published bundle would be a write-access compromise.

  The integrity hash is the real pin: the browser refuses the script unless the
  bytes match. `crossorigin="anonymous"` is required for SRI on a cross-origin
  script, and works here because unpkg sends `Access-Control-Allow-Origin: *`.

  Recompute when bumping the version, and read the diff before you do:
    curl -sL https://unpkg.com/decap-cms@<v>/dist/decap-cms.js \
      | openssl dgst -sha384 -binary | openssl base64 -A
-->
<script src="https://unpkg.com/decap-cms@3.8.4/dist/decap-cms.js"
        integrity="sha384-JNjmpWfdPuQ3I7ac38W0teoHcVxx7YdfDVpcgehfGqcu6ZBt26m/nmmBM2FzuO41"
        crossorigin="anonymous"></script>
<script src="/admin/preview.js" type="module"></script>
</body>
</html>
