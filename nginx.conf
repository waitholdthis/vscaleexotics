# VScale Exotics — nginx server block.
# Include inside an existing http {} context. Mirrors _headers and vercel.json.

server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         vscaleexotics.com www.vscaleexotics.com;

    root                /var/www/vscaleexotics;
    index               index.html;
    charset             utf-8;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/vscaleexotics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vscaleexotics.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ---- Security headers ----
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; frame-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Origin-Agent-Cluster "?1" always;

    server_tokens off;

    # ---- Compression ----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    # ---- Rate limiting for the enquiry endpoint ----
    # Defined in http {}:  limit_req_zone $binary_remote_addr zone=enquiry:10m rate=5r/m;
    location = /api/enquiry {
        limit_req            zone=enquiry burst=3 nodelay;
        limit_except POST    { deny all; }
        client_max_body_size 16k;
        proxy_pass           http://127.0.0.1:8081;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
    }

    # ---- Caching ----
    location ^~ /assets/img/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /assets/css/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        try_files $uri =404;
    }
    location ^~ /assets/js/data/ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }
    location ^~ /assets/js/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
    location = /.well-known/security.txt {
        default_type text/plain;
    }

    # Block access to repository and tooling files that should never be served.
    location ~ ^/(\.git|node_modules|tools)/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~ ^/(package\.json|package-lock\.json)$ { deny all; return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}

# HTTP → HTTPS
server {
    listen      80;
    listen      [::]:80;
    server_name vscaleexotics.com www.vscaleexotics.com;
    return      301 https://vscaleexotics.com$request_uri;
}
